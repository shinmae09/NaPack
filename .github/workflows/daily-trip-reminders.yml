
name: NaPack Daily Trip Reminders

on:
  schedule:
    # Noon Philippines time (04:00 UTC).
    - cron: '0 4 * * *'
    # Midnight Philippines time (16:00 UTC, previous UTC date).
    - cron: '0 16 * * *'

  workflow_dispatch:
    inputs:
      reminder_mode:
        description: 'Which reminder schedule should be tested?'
        required: true
        type: choice
        options:
          - noon
          - midnight
        default: noon
      target_date:
        description: 'Optional Manila evaluation date (YYYY-MM-DD).'
        required: false
        type: string
      dry_run:
        description: 'Preview only; do not send notifications or update Firestore.'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: napack-daily-trip-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin

      - name: Find trips and send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TARGET_DATE_OVERRIDE: ${{ inputs.target_date }}
          REMINDER_MODE_INPUT: ${{ inputs.reminder_mode }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node --input-type=module <<'NODE'
          import { initializeApp, cert } from 'firebase-admin/app'
          import {
            FieldValue,
            getFirestore,
          } from 'firebase-admin/firestore'
          import { getMessaging } from 'firebase-admin/messaging'

          function getManilaDate(date = new Date()) {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Manila',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).formatToParts(date)

            const values = Object.fromEntries(
              parts.map(({ type, value }) => [type, value]),
            )

            return `${values.year}-${values.month}-${values.day}`
          }

          function isValidDateString(value) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false

            const date = new Date(`${value}T00:00:00Z`)
            return !Number.isNaN(date.getTime()) &&
              date.toISOString().slice(0, 10) === value
          }

          const override = process.env.TARGET_DATE_OVERRIDE?.trim()

          if (override && !isValidDateString(override)) {
            throw new Error(
              'TARGET_DATE_OVERRIDE must be a valid YYYY-MM-DD date.',
            )
          }

          const runDate = override || getManilaDate()
          const isManualRun =
            process.env.GITHUB_EVENT_NAME === 'workflow_dispatch'

          let reminderMode

          if (isManualRun) {
            reminderMode = process.env.REMINDER_MODE_INPUT
          } else if (
            process.env.GITHUB_EVENT_SCHEDULE === '0 16 * * *'
          ) {
            reminderMode = 'midnight'
          } else if (
            process.env.GITHUB_EVENT_SCHEDULE === '0 4 * * *'
          ) {
            reminderMode = 'noon'
          } else {
            throw new Error('Could not determine the scheduled reminder mode.')
          }

          if (!['noon', 'midnight'].includes(reminderMode)) {
            throw new Error('Reminder mode must be noon or midnight.')
          }

          // Manual runs default to preview-only. Scheduled runs send normally.
          const dryRun = isManualRun &&
            process.env.DRY_RUN_INPUT === 'true'

          const rawCredentials =
            process.env.FIREBASE_SERVICE_ACCOUNT_JSON

          if (!rawCredentials) {
            throw new Error(
              'Missing FIREBASE_SERVICE_ACCOUNT_JSON secret.',
            )
          }

          const credentials = JSON.parse(rawCredentials)

          initializeApp({
            credential: cert(credentials),
            projectId: credentials.project_id,
          })

          const db = getFirestore()
          const messaging = getMessaging()

          console.log(`Philippines evaluation date: ${runDate}`)
          console.log(`Reminder mode: ${reminderMode}`)
          console.log(`Dry run: ${dryRun}`)

          const tripsSnapshot = await db
            .collectionGroup('tripReminders')
            .get()

          let matched = 0
          let sent = 0
          let previewed = 0
          let skipped = 0
          let failed = 0

          for (const tripDoc of tripsSnapshot.docs) {
            const trip = tripDoc.data()

            if (
              trip.status !== 'active' ||
              typeof trip.departureDate !== 'string' ||
              !isValidDateString(trip.departureDate)
            ) {
              continue
            }

            const isDepartureDay = trip.departureDate === runDate

            // Midnight: trips departing today.
            // Noon: trips departing after today.
            if (reminderMode === 'midnight' && !isDepartureDay) {
              continue
            }

            if (
              reminderMode === 'noon' &&
              trip.departureDate <= runDate
            ) {
              continue
            }

            matched += 1

            // Avoid duplicate reminders for the same trip and Manila date.
            if (trip.dailyReminderSentFor === runDate) {
              console.log(
                `Already reminded for this date; skipping trip ${trip.tripId}.`,
              )
              skipped += 1
              continue
            }

            const userDoc = tripDoc.ref.parent.parent

            if (!userDoc) {
              console.error(
                `Could not identify owner of trip ${trip.tripId}.`,
              )
              failed += 1
              continue
            }

            const subscriptionRef = db.doc(
              `users/${userDoc.id}/pushSubscriptions/current`,
            )

            const subscriptionSnapshot = await subscriptionRef.get()

            if (!subscriptionSnapshot.exists) {
              console.log(`No subscription for trip ${trip.tripId}.`)
              skipped += 1
              continue
            }

            const subscription = subscriptionSnapshot.data()

            if (
              subscription?.enabled !== true ||
              typeof subscription.token !== 'string' ||
              !subscription.token
            ) {
              console.log(`No enabled token for trip ${trip.tripId}.`)
              skipped += 1
              continue
            }

            const tripName = trip.tripName || 'Your trip'

            const title = isDepartureDay
              ? 'Your trip is today!'
              : 'Trip reminder'

            const body = isDepartureDay
              ? `${tripName} departs today. Check your NaPack checklist before you go.`
              : `${tripName} is coming up on ${trip.departureDate}. Check your NaPack checklist before you go.`

            if (dryRun) {
              console.log(
                `[DRY RUN] Would send "${title}" for trip ${trip.tripId}, departure ${trip.departureDate}.`,
              )
              previewed += 1
              continue
            }

            try {
              await messaging.send({
                token: subscription.token,
                data: {
                  title,
                  body,
                  url: '/',
                },
              })

              // Record the date only after FCM accepts the message.
              await tripDoc.ref.update({
                dailyReminderSentFor: runDate,
                dailyReminderSentAt: FieldValue.serverTimestamp(),
              })

              console.log(
                `Reminder accepted for trip ${trip.tripId}.`,
              )
              sent += 1
            } catch (error) {
              console.error(
                `Reminder failed for trip ${trip.tripId}:`,
                error instanceof Error
                  ? error.message
                  : 'Unknown error',
              )
              failed += 1
            }
          }

          console.log(`Matching trips: ${matched}`)
          console.log(`Previewed reminders: ${previewed}`)
          console.log(`Reminders sent: ${sent}`)
          console.log(`Skipped: ${skipped}`)
          console.log(`Failed: ${failed}`)

          if (failed > 0) {
            throw new Error(`${failed} reminder(s) failed.`)
          }
          NODE
