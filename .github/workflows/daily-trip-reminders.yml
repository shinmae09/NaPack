name: NaPack Daily Trip Reminders

on:
  schedule:
    # 08:00 in the Philippines (00:00 UTC).
    - cron: '0 0 * * *'

  workflow_dispatch:
    inputs:
      target_date:
        description: 'Optional test date (YYYY-MM-DD). Remind trips departing the following day.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: napack-daily-trip-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firebase Admin SDK
        run: npm install --no-save firebase-admin

      - name: Find trips and send reminders
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TARGET_DATE_OVERRIDE: ${{ inputs.target_date }}
        run: |
          node --input-type=module <<'NODE'
          import {
            initializeApp,
            cert,
          } from 'firebase-admin/app'
          import {
            FieldValue,
            getFirestore,
          } from 'firebase-admin/firestore'
          import {
            getMessaging,
          } from 'firebase-admin/messaging'

          function getManilaDate(date = new Date()) {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Manila',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
            }).formatToParts(date)

            const values = Object.fromEntries(
              parts.map(({ type, value }) => [type, value]),
            )

            return `${values.year}-${values.month}-${values.day}`
          }

          function addDays(dateString, days) {
            const date = new Date(`${dateString}T12:00:00Z`)
            date.setUTCDate(date.getUTCDate() + days)
            return date.toISOString().slice(0, 10)
          }

          const override = process.env.TARGET_DATE_OVERRIDE?.trim()

          if (override && !/^\d{4}-\d{2}-\d{2}$/.test(override)) {
            throw new Error('TARGET_DATE_OVERRIDE must use YYYY-MM-DD format.')
          }

          const today = getManilaDate()
          const targetDepartureDate = addDays(override || today, 1)

          const rawCredentials = process.env.FIREBASE_SERVICE_ACCOUNT_JSON

          if (!rawCredentials) {
            throw new Error('Missing FIREBASE_SERVICE_ACCOUNT_JSON secret.')
          }

          const credentials = JSON.parse(rawCredentials)

          initializeApp({
            credential: cert(credentials),
            projectId: credentials.project_id,
          })

          const db = getFirestore()
          const messaging = getMessaging()

          console.log(`Philippines date: ${today}`)
          console.log(`Checking trips departing: ${targetDepartureDate}`)

          const tripsSnapshot = await db
            .collectionGroup('tripReminders')
            .get()

          let matched = 0
          let sent = 0
          let skipped = 0
          let failed = 0

          for (const tripDoc of tripsSnapshot.docs) {
            const trip = tripDoc.data()

            if (
              trip.status !== 'active' ||
              trip.departureDate !== targetDepartureDate
            ) {
              continue
            }

            matched += 1

            if (trip.dayBeforeReminderSentFor === trip.departureDate) {
              console.log(`Already reminded for trip ${trip.tripId}.`)
              skipped += 1
              continue
            }

            const userDoc = tripDoc.ref.parent.parent

            if (!userDoc) {
              console.error(`Could not identify owner of trip ${trip.tripId}.`)
              failed += 1
              continue
            }

            const subscriptionRef = db.doc(
              `users/${userDoc.id}/pushSubscriptions/current`,
            )

            const subscriptionSnapshot = await subscriptionRef.get()

            if (!subscriptionSnapshot.exists) {
              console.log(`No subscription for trip ${trip.tripId}.`)
              skipped += 1
              continue
            }

            const subscription = subscriptionSnapshot.data()

            if (
              subscription?.enabled !== true ||
              typeof subscription.token !== 'string' ||
              !subscription.token
            ) {
              console.log(`No enabled token for trip ${trip.tripId}.`)
              skipped += 1
              continue
            }

            try {
              await messaging.send({
                token: subscription.token,
                data: {
                  title: 'Your trip is tomorrow!',
                  body: `${trip.tripName || 'Your trip'} departs tomorrow. Check your NaPack checklist before you go.`,
                  url: '/',
                },
              })

              // Record success only after FCM accepts the message.
              await tripDoc.ref.update({
                dayBeforeReminderSentFor: trip.departureDate,
                dayBeforeReminderSentAt: FieldValue.serverTimestamp(),
              })

              console.log(`Reminder accepted for trip ${trip.tripId}.`)
              sent += 1
            } catch (error) {
              console.error(
                `Reminder failed for trip ${trip.tripId}:`,
                error instanceof Error ? error.message : 'Unknown error',
              )
              failed += 1
            }
          }

          console.log(`Matching trips: ${matched}`)
          console.log(`Reminders sent: ${sent}`)
          console.log(`Skipped: ${skipped}`)
          console.log(`Failed: ${failed}`)

          if (failed > 0) {
            throw new Error(`${failed} reminder(s) failed.`)
          }
          NODE
